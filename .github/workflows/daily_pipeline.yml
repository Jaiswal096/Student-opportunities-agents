name: Daily Opportunity Pipeline

on:
  schedule:
    # Runs every day at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions UI

permissions:
  contents: write  # Required to commit and push opportunities.json

jobs:
  run-pipeline:
    name: Scout -> Gatekeeper -> Curator -> Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out the repository
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # -----------------------------------------------------------------------
      # 2. Set up Python 3.11 with pip dependency caching
      # -----------------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -----------------------------------------------------------------------
      # 3. Install pipeline dependencies (including Supabase)
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pydantic supabase python-dotenv

      # -----------------------------------------------------------------------
      # 4. Run the full opportunity pipeline with Supabase upsert
      # -----------------------------------------------------------------------
      - name: Run opportunity pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python opportunity_pipeline.py

      # -----------------------------------------------------------------------
      # 5. Commit and push opportunities.json if it was updated
      #    [skip ci] prevents this commit from re-triggering the workflow
      # -----------------------------------------------------------------------
      - name: Commit updated opportunities.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage opportunities and broadcasts across root and public/
          git add opportunities.json public/opportunities.json broadcasts.json public/broadcasts.json 2>/dev/null || true

          # Only commit if there are staged changes
          if git diff --cached --quiet; then
            echo "No data changes -- skipping commit."
          else
            git commit -m "data: update opportunities and broadcasts [skip ci]"
            git push
            echo "Opportunities data pushed successfully."
          fi
